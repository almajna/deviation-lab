name: Routing replay laboratory
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/routing-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: python3 scripts/test_routing_fixture.py
      - name: Rebuild from original verified routing archives
        run: python3 scripts/verify_routing_archives.py
      - run: python3 scripts/build_economic_fixture.py --check
