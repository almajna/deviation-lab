name: Python and shared contract CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit and shared contract conformance tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Install package and reproduce v0.2 synthetic simulator artifact
        run: |
          python -m pip install --no-deps .
          python -m deviation.simulator tests/fixtures/simulator/two_task.json --out "$RUNNER_TEMP/simulator" --verify artifacts/simulator/two_task/receipts.json
      - name: Generate synthetic replay
        run: PYTHONPATH=src python -m deviation demo --out /tmp/deviation_demo.json
      - name: Validate trace flags
        run: |
          python - <<'PY'
          import json
          d = json.load(open('/tmp/deviation_demo.json', encoding='utf-8'))
          assert d['data_kind'] == 'SYNTHETIC'
          assert d['metrics']['cost'] <= d['config']['budget']
          assert len(d['events']) > 0
          print('Synthetic trace validated')
          PY
