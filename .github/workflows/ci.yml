name: Python and shared contract CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit and shared contract conformance tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Install package and reproduce v0.2 synthetic simulator artifact
        run: |
          python -m pip install --no-deps .
          python -m deviation.simulator tests/fixtures/simulator/two_task.json --out "$RUNNER_TEMP/simulator" --verify artifacts/simulator/phase4_source/receipts.json
          python -m deviation.markets tests/fixtures/markets/two_task.json --out "$RUNNER_TEMP/market" --verify artifacts/markets/phase4_source/receipts.json
      - name: Verify immutable Phase 2 receipts at their pinned historical source
        run: |
          historical_source="$RUNNER_TEMP/deviation-historical-source"
          mkdir -p "$historical_source"
          git archive 390e1b7a63cf31306d78815e381f81ec7245f8d6 | tar -x -C "$historical_source"
          PYTHONPATH="$historical_source/src" python -m deviation.simulator tests/fixtures/simulator/two_task.json --out "$RUNNER_TEMP/historical-replay" --verify artifacts/simulator/two_task/receipts.json
      - name: Verify immutable Phase 3 receipts at their pinned historical source
        run: |
          phase3_source="$RUNNER_TEMP/deviation-phase3-source"
          mkdir -p "$phase3_source"
          git archive 1afe571d84831d9d0868dbdef5ae46df1c4c0b2d | tar -x -C "$phase3_source"
          PYTHONPATH="$phase3_source/src" python -m deviation.simulator tests/fixtures/simulator/two_task.json --out "$RUNNER_TEMP/phase3-simulator" --verify artifacts/simulator/v0_3_source/receipts.json
          PYTHONPATH="$phase3_source/src" python -m deviation.markets tests/fixtures/markets/two_task.json --out "$RUNNER_TEMP/phase3-market" --verify artifacts/markets/two_task/receipts.json
      - name: Reproduce installed adversarial counterexample and all-case campaign
        run: |
          python -I -m deviation.attacks replay artifacts/attacks/phase4/selected --out "$RUNNER_TEMP/attack-replay"
          diff -r artifacts/attacks/phase4/selected "$RUNNER_TEMP/attack-replay"
          python -I -m deviation.attacks campaign experiments/adversarial_protocol.json --out "$RUNNER_TEMP/attack-campaign"
          cmp artifacts/attacks/phase4/campaign.json "$RUNNER_TEMP/attack-campaign/campaign.json"
          python -I -m deviation.attacks sensitivity artifacts/attacks/phase4/selected --out "$RUNNER_TEMP/attack-sensitivity"
          cmp artifacts/attacks/phase4/sensitivity.json "$RUNNER_TEMP/attack-sensitivity/sensitivity.json"
      - name: Generate synthetic replay
        run: PYTHONPATH=src python -m deviation demo --out /tmp/deviation_demo.json
      - name: Validate trace flags
        run: |
          python - <<'PY'
          import json
          d = json.load(open('/tmp/deviation_demo.json', encoding='utf-8'))
          assert d['data_kind'] == 'SYNTHETIC'
          assert d['metrics']['cost'] <= d['config']['budget']
          assert len(d['events']) > 0
          print('Synthetic trace validated')
          PY
