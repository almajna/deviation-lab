name: Python and shared contract CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install combined package and pinned scientific plotting dependency
        run: |
          python -m pip install --no-deps .
          python -m pip install matplotlib==3.10.7
      - name: Complete combined unit, boundary and mathematical suite
        run: python -m unittest discover -s tests -v
      - name: Strict original-source and installed integration reproduction
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/mpl
        run: |
          python -I -m deviation_integration --cache "$RUNNER_TEMP/audit-cache" --download --out "$RUNNER_TEMP/integration" --plots --verify artifacts/integration/manifest.json
      - name: Generate synthetic replay and validate flags
        run: |
          python -I -m deviation demo --out "$RUNNER_TEMP/deviation_demo.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads((Path(os.environ['RUNNER_TEMP'])/'deviation_demo.json').read_text())
          assert d['data_kind'] == 'SYNTHETIC'
          assert d['metrics']['cost'] <= d['config']['budget']
          assert len(d['events']) > 0
          PY
      - name: Print step receipts on failure
        if: failure()
        run: |
          if test -f "$RUNNER_TEMP/integration/execution.json"; then cat "$RUNNER_TEMP/integration/execution.json"; fi
          if test -f "$RUNNER_TEMP/integration/FAILURE.json"; then cat "$RUNNER_TEMP/integration/FAILURE.json"; fi
          if test -d "$RUNNER_TEMP/integration/logs"; then tail -n 20 "$RUNNER_TEMP/integration/logs/"*.log; fi
          if test -f "$RUNNER_TEMP/integration/manifest.json"; then
            python - <<'PY_MANIFEST'
          import base64, os
          from pathlib import Path
          data=base64.b64encode((Path(os.environ['RUNNER_TEMP'])/'integration/manifest.json').read_bytes()).decode()
          print('INTEGRATION_MANIFEST_BEGIN')
          for i in range(0,len(data),8000): print('INTEGRATION_MANIFEST_CHUNK '+data[i:i+8000])
          print('INTEGRATION_MANIFEST_END')
          PY_MANIFEST
          fi
