name: Real open-weight CPU pilot (free public runner)
on:
  pull_request:
    paths:
      - '.github/workflows/llm-real-pilot.yml'
      - 'experiments/llm_real_pilot.json'
      - 'src/deviation_llm_agents/transformers_cpu.py'
      - 'src/deviation_llm_agents/pilot.py'
jobs:
  real-inference:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU-only inference runtime
        if: hashFiles('artifacts/llm_agents/real_pilot.json') == ''
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.51.3 huggingface-hub==0.30.2 safetensors==0.5.3 tokenizers==0.21.1
          python -m pip install --no-deps .
      - name: Execute fixed six-episode pilot and emit auditable log bundle
        if: hashFiles('artifacts/llm_agents/real_pilot.json') == ''
        run: python -I -m deviation_llm_agents.pilot --out "$RUNNER_TEMP/real-pilot.json" --cache "$RUNNER_TEMP/model-weights"
      - name: Reproduce committed real decisions without new inference
        if: hashFiles('artifacts/llm_agents/real_pilot.json') != ''
        run: |
          python -m pip install --no-deps .
          python -I -m deviation_llm_agents.pilot --verify artifacts/llm_agents/real_pilot.json --out "$RUNNER_TEMP/real-pilot-replay.json"
          cmp artifacts/llm_agents/real_pilot_replay.json "$RUNNER_TEMP/real-pilot-replay.json"
