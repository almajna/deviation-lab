name: Committed real LLM pilot replay (zero inference)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recorded-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install standard-library instrument and replay original observed pilot
        run: |
          python -m pip install --no-deps .
          mkdir -p "$RUNNER_TEMP/agent-source"
          git archive cb9347fe5580bf4e3a83bc81cc99fe620098da3d | tar -x -C "$RUNNER_TEMP/agent-source"
          PYTHONPATH="$RUNNER_TEMP/agent-source/src" python -m deviation_llm_agents.pilot --verify artifacts/llm_agents/real_pilot.json --out "$RUNNER_TEMP/real-pilot-replay.json"
          cmp artifacts/llm_agents/real_pilot_replay.json "$RUNNER_TEMP/real-pilot-replay.json"
      - name: Replay the same recorded decisions through the installed combined engine
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          from deviation_integration.provenance import read, write, sha
          from deviation_integration.bridge import replay_pilot
          target=Path(os.environ['RUNNER_TEMP'])/'pilot.json'
          write(target,replay_pilot(read('artifacts/llm_agents/real_pilot.json')))
          expected=read('artifacts/integration/manifest.json')['files']['current/agents/pilot.json']
          assert sha(target)==expected
          PY
