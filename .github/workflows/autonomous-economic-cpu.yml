name: Autonomous economic experiment CPU inference
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structured-inference:
    if: ${{ github.event.repository.visibility == 'public' && github.repository == 'almajna/deviation-lab' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NO_CLOUD: '1'
    steps:
      - name: Check free local structured inference
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 \
            "https://ollama.com/download/ollama-linux-amd64.tar.zst" \
            -o "$RUNNER_TEMP/ollama.tar.zst"
          sha256sum "$RUNNER_TEMP/ollama.tar.zst"
          mkdir "$RUNNER_TEMP/ollama"
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$RUNNER_TEMP/ollama"
          ollama="$RUNNER_TEMP/ollama/bin/ollama"
          export OLLAMA_MODELS="$RUNNER_TEMP/models"
          "$ollama" serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:11434/api/version
          "$ollama" pull qwen2.5:7b
          curl --fail --silent --show-error http://127.0.0.1:11434/api/tags
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen
          payload = {"model": "qwen2.5:7b", "stream": False,
                     "messages": [{"role": "user", "content": "Return an object with color equal to blue."}],
                     "format": {"type": "object", "properties": {"color": {"enum": ["blue", "green"]}},
                                "required": ["color"], "additionalProperties": False},
                     "options": {"seed": 7, "temperature": 0, "num_ctx": 4096, "num_predict": 32, "num_gpu": 0}}
          request = Request("http://127.0.0.1:11434/api/chat", data=json.dumps(payload).encode(),
                            headers={"Content-Type": "application/json"})
          with urlopen(request, timeout=180) as response:
              receipt = json.load(response)
          print(json.dumps(receipt))
          assert json.loads(receipt["message"]["content"])["color"] in {"blue", "green"}
          assert receipt["done"] and receipt["eval_count"] > 0
          PY
