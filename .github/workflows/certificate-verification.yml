name: Independent certificate reproduction
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-verification:
    timeout-minutes: 60
    strategy:
      matrix:
        python: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install current package
        run: python -m pip install --no-deps .
      - name: All unit and mathematical tests
        run: python -m unittest discover -s tests -v
      - name: Stage exact source for immutable published proof archive
        run: |
          mkdir -p "$RUNNER_TEMP/verification-source"
          git archive f199007eca28097f70115c5f9a20276b046fe95c | tar -x -C "$RUNNER_TEMP/verification-source"
          echo "PYTHONPATH=$RUNNER_TEMP/verification-source/src" >> "$GITHUB_ENV"
      - name: Reproduce all frozen development cases through independent checker
        run: python -m deviation.verification --out "$RUNNER_TEMP/independent" --no-timings --verify artifacts/verification/results.json
      - name: Check all retained example proofs against exact original source
        run: |
          for mechanism in lmsr interactive-pool pool; do
            python -m deviation.verification --certificate "artifacts/verification/examples/base-101-$mechanism.json" --mechanism "$mechanism"
          done
      - name: Independently check all retained compressed proofs without optimization
        run: python "$RUNNER_TEMP/verification-source/scripts/check_certificate_archive.py" artifacts/verification
      - name: Verify scientific figure and input bindings
        run: |
          python - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          base = Path('artifacts/verification')
          manifest = json.loads((base/'figure_manifest.json').read_text())
          for name, expected in manifest.items():
              if name == 'figures':
                  for file, value in expected.items():
                      assert sha256((base/'figures'/file).read_bytes()).hexdigest() == value
              else:
                  path = Path('scripts')/name if name.endswith('.py') else base/name
                  assert sha256(path.read_bytes()).hexdigest() == expected
          PY
