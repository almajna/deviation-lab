name: Read-only finite-beta artifact verification
on:
  push:
    branches: [research/finite-beta-artifact-transfer]
    paths: ['.github/workflows/finite-beta-transfer.yml']
permissions:
  contents: read
  actions: read
jobs:
  read-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download exact historical artifact and verify archive hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/almajna/deviation-lab/actions/artifacts/13445404664/zip > "$RUNNER_TEMP/frozen-audit.zip"
          printf '%s  %s\n' 5e8751c18ea37ec78a469fe85229b9a2f083e8b3c51b7d6e0ef6ab374a06f379 "$RUNNER_TEMP/frozen-audit.zip" | sha256sum --check
      - name: Verify selected nonsecret aggregate receipts and print for independent review
        env:
          AUDIT_ZIP: ${{ runner.temp }}/frozen-audit.zip
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, zipfile
          names = ['finite-beta-input.json','finite-beta-canonical.json',
                   'finite-beta-results.json','finite-beta-certificate.json',
                   'output-sha256.txt','dataset-sha256.txt','source-sha256.txt']
          with zipfile.ZipFile(os.environ['AUDIT_ZIP']) as archive:
              assert archive.testzip() is None
              output = {}
              for name in names:
                  members = [x for x in archive.infolist() if x.filename.rsplit('/',1)[-1] == name]
                  assert len(members) == 1 and members[0].file_size < 2_000_000, (name, len(members))
                  data = archive.read(members[0])
                  output[name] = {'sha256': hashlib.sha256(data).hexdigest(),
                                  'base64': base64.b64encode(data).decode('ascii')}
          print('AGGREGATE_RECEIPTS_JSON ' + json.dumps(output, sort_keys=True))
          PY
