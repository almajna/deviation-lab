name: AgentOps metadata diagnostic
on:
  push:
    branches: [research/agentops-source-diagnostic-20261105]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Stage pinned public archive
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --max-time 180 'https://github.com/kunwarshivam/agentops-bench/releases/download/v1.0/agentops-bench-v1.0-pilot-traces.tar.gz' --output /tmp/aob-diag.tar.gz
          printf '%s  %s\n' e185bfd037fa9fa5727dbae0eb8eba421dfb5011dfec6f4dc60b111d51e7a85f /tmp/aob-diag.tar.gz | sha256sum --check --status
          sudo install -d -m 0755 /tmp/aob-diag-input
          sudo install -m 0644 /tmp/aob-diag.tar.gz /tmp/aob-diag-input/pilot.tar.gz
          sudo install -m 0644 research/agentops-acquisition/metadata_diagnostic.py /tmp/aob-diag-input/metadata_diagnostic.py
          sudo install -m 0644 research/agentops-acquisition/diagnostic_sandbox.sh /tmp/aob-diag-input/sandbox.sh
          sudo install -d -m 0755 -o nobody -g nogroup /tmp/aob-diag-output
      - name: Inspect structure in isolated namespace
        run: |
          set -euo pipefail
          status=0
          sudo unshare --net bash -c 'set -euo pipefail; ip link set lo up; exec setpriv --reuid=nobody --regid=nogroup --clear-groups --inh-caps=-all --bounding-set=-all --ambient-caps=-all --no-new-privs env -i PATH=/usr/bin:/bin HOME=/tmp LANG=C.UTF-8 bash /tmp/aob-diag-input/sandbox.sh' || status=$?
          if [ -f /tmp/aob-diag-output/metadata.json ]; then cat /tmp/aob-diag-output/metadata.json; fi
          exit "$status"
      - name: Preserve metadata only
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: agentops-metadata-diagnostic
          path: /tmp/aob-diag-output/metadata.json
          if-no-files-found: warn
          retention-days: 90
