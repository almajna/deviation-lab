name: AgentOps acquisition audit
on:
  push:
    branches: [research/agentops-acquisition-20261105]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Synthetic-only contract tests
        run: python3 -m unittest -v test_audit
        working-directory: research/agentops-acquisition
      - name: Stage release and compare upstream digest if provided
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --max-time 180 'https://api.github.com/repos/kunwarshivam/agentops-bench/releases/tags/v1.0' --output /tmp/aob-release.json
          curl --fail --silent --show-error --location --retry 2 --max-time 180 'https://github.com/kunwarshivam/agentops-bench/releases/download/v1.0/agentops-bench-v1.0-pilot-traces.tar.gz' --output /tmp/aob-pilot.tar.gz
          python3 research/agentops-acquisition/stage.py /tmp/aob-release.json /tmp/aob-pilot.tar.gz /tmp/aob-receipt.json
          sudo install -d -m 0755 /tmp/aob-input
          sudo install -m 0644 /tmp/aob-pilot.tar.gz /tmp/aob-input/pilot.tar.gz
          sudo install -m 0644 research/agentops-acquisition/audit.py /tmp/aob-input/audit.py
          sudo install -m 0644 research/agentops-acquisition/sandbox.sh /tmp/aob-input/sandbox.sh
          sudo install -d -m 0755 -o nobody -g nogroup /tmp/aob-output
          sudo install -m 0644 -o nobody -g nogroup /tmp/aob-receipt.json /tmp/aob-output/source-receipt.json
      - name: Execute our analysis without credentials or network
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare --net bash -c 'set -euo pipefail; ip link set lo up; exec setpriv --reuid=nobody --regid=nogroup --clear-groups --inh-caps=-all --bounding-set=-all --ambient-caps=-all --no-new-privs env -i PATH=/usr/bin:/bin HOME=/tmp LANG=C.UTF-8 bash /tmp/aob-input/sandbox.sh'
      - name: Hash any preserved aggregate receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /tmp/aob-output ]; then
            cd /tmp/aob-output
            sudo sh -c 'sha256sum *.json > SHA256SUMS' || true
          fi
      - name: Preserve aggregate evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: agentops-acquisition-aggregate
          path: /tmp/aob-output/
          if-no-files-found: warn
          retention-days: 90
